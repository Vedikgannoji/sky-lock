<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Lock - Space Environment Simulation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    /* FPS Counter (Top-Left) */
    #fps-counter {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #0f0;
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 0 6px rgba(0, 255, 0, 0.4);
      pointer-events: none;
      z-index: 1000;
      font-family: 'Courier New', monospace;
      background: rgba(0, 0, 0, 0.45);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 0, 0.2);
    }

    /* Satellite Hover Tooltip */
    #satellite-tooltip {
      position: fixed;
      display: none;
      pointer-events: none;
      z-index: 2000;
      background: rgba(15, 23, 42, 0.92);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.7);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.45);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
      transform: translate(-50%, -135%);
      white-space: nowrap;
    }

    /* Simulation Control Panel (Top-Right) */
    #control-panel {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 1000;
      background: rgba(12, 16, 26, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 14px 16px;
      width: 275px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65);
      color: #e2e8f0;
      font-size: 13px;
    }

    #control-panel::-webkit-scrollbar {
      width: 4px;
    }
    #control-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .panel-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .control-label {
      font-weight: 500;
      color: #cbd5e1;
    }

    /* Speed Button Group */
    .speed-btn-group {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .speed-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .speed-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .speed-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
    }

    /* Toggle Buttons (Orbit Lines & Pause) */
    .toggle-btn {
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      min-width: 65px;
      text-align: center;
    }

    .toggle-btn.on {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.2);
    }

    .toggle-btn.on:hover {
      background: rgba(16, 185, 129, 0.3);
    }

    .toggle-btn.off {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .toggle-btn.off:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    /* Pause Button */
    .pause-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .pause-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .pause-btn.paused {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.5);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    .pause-btn.paused:hover {
      background: rgba(245, 158, 11, 0.3);
    }

    /* Satellite Mode Buttons */
    .mode-btn-group {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      text-align: center;
    }

    .mode-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .mode-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
    }

    /* Manual Mode Section */
    #manual-satellite-section {
      display: none;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .panel-subheader {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      padding: 8px 6px;
      cursor: grab;
      transition: all 0.2s ease;
    }

    .preview-box:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.2);
    }

    .preview-box:active, .preview-box.dragging {
      cursor: grabbing;
      opacity: 0.7;
    }

    #satellite-preview-canvas {
      width: 140px;
      height: 90px;
      pointer-events: none;
    }

    .drag-hint {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1.5px;
      margin-top: 4px;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    /* Live Satellite Status Section */
    #satellites-status-section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .no-satellites-msg {
      font-size: 12px;
      color: #64748b;
      font-style: italic;
      text-align: center;
      padding: 10px 0;
    }

    .satellite-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }

    .satellite-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
    }

    .sat-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .sat-id-tag {
      font-weight: 700;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .sat-status-badge {
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sat-status-badge.active {
      color: #34d399;
    }

    .sat-status-badge.paused {
      color: #fbbf24;
    }

    .status-dot {
      font-size: 9px;
    }

    .sat-control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .sat-control-label {
      font-size: 11px;
      font-weight: 500;
      color: #94a3b8;
    }

    .sat-speed-group {
      display: flex;
      gap: 3px;
      background: rgba(0, 0, 0, 0.35);
      padding: 2px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sat-speed-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 2px 7px;
      font-size: 10.5px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .sat-speed-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .sat-speed-btn.active {
      background: #2563eb;
      color: #ffffff;
    }

    .sat-actions-row {
      display: flex;
      gap: 6px;
    }

    .sat-action-btn {
      flex: 1;
      padding: 4px 6px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      transition: all 0.15s ease;
      font-family: inherit;
      text-align: center;
    }

    .sat-action-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .sat-action-btn.pause-action.paused {
      background: rgba(245, 158, 11, 0.2);
      border-color: rgba(245, 158, 11, 0.5);
      color: #fbbf24;
    }

    .sat-action-btn.remove-action:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      color: #f87171;
    }

    /* Inter-Satellite Comms Console (Bottom-Left) */
    #comms-console {
      position: fixed;
      bottom: 14px;
      left: 14px;
      z-index: 1000;
      width: 480px;
      max-width: calc(100vw - 28px);
      background: rgba(10, 15, 26, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
    }

    .comms-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .comms-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #38bdf8;
    }

    .comms-status-indicator {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: comms-pulse 1.8s infinite ease-in-out;
    }

    .comms-status-indicator.offline {
      background: #eab308;
      box-shadow: 0 0 6px #eab308;
      animation: none;
    }

    @keyframes comms-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    .comms-log {
      height: 140px;
      max-height: 140px;
      min-height: 140px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(56, 189, 248, 0.25) transparent;
      user-select: text;
      box-sizing: border-box;
    }

    .comms-log::-webkit-scrollbar {
      width: 4px;
    }
    .comms-log::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.25);
      border-radius: 4px;
    }

    .comms-line {
      flex-shrink: 0;
      height: 18px;
      min-height: 18px;
      font-size: 11px;
      line-height: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
    }

    .comms-peer {
      color: #38bdf8;
      font-weight: 600;
    }

    .comms-type {
      color: #c084fc;
      font-weight: 600;
    }

    .comms-dist {
      color: #e2e8f0;
    }

    .comms-dv {
      color: #fbbf24;
    }

    .comms-link-locked {
      color: #4ade80;
      font-weight: 600;
    }

    .comms-link-wait {
      color: #f59e0b;
      font-weight: 600;
    }

    .comms-link-obstructed {
      color: #ef4444;
      font-weight: 700;
      text-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
    }

    .comms-status-indicator.obstructed {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: comms-pulse-fast 0.8s infinite ease-in-out;
    }

    @keyframes comms-pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(0.75); }
    }
  </style>
</head>
<body>
  <div id="fps-counter">FPS: --</div>
  <div id="satellite-tooltip">S-1</div>

  <!-- Inter-Satellite Comms Console (Bottom-Left) -->
  <div id="comms-console">
    <div class="comms-header">
      <div class="comms-title">
        <span class="comms-status-indicator" id="comms-status-dot"></span>
        <span>ISL COMMS TERMINAL</span>
      </div>
      <span style="color: #64748b; font-size: 10px; font-weight: 600;">ACTIVE LINK</span>
    </div>
    <div class="comms-log" id="comms-log-container">
      <!-- Live telemetry log lines -->
    </div>
  </div>

  <!-- Control Panel -->
  <div id="control-panel">
    <div class="panel-header">SIMULATION</div>

    <!-- Speed Row -->
    <div class="control-row">
      <span class="control-label">Speed</span>
      <div class="speed-btn-group" id="speed-group">
        <button class="speed-btn active" data-speed="1" id="speed-1x">1×</button>
        <button class="speed-btn" data-speed="2" id="speed-2x">2×</button>
        <button class="speed-btn" data-speed="4" id="speed-4x">4×</button>
      </div>
    </div>

    <!-- Orbit Lines Row -->
    <div class="control-row">
      <span class="control-label">Orbit Lines</span>
      <button class="toggle-btn on" id="orbit-lines-toggle">ON</button>
    </div>

    <!-- ISL Link Row -->
    <div class="control-row">
      <span class="control-label">ISL Link</span>
      <button class="toggle-btn on" id="isl-link-toggle">ON</button>
    </div>

    <!-- Pause / Resume Row -->
    <div class="control-row">
      <span class="control-label">Pause</span>
      <button class="toggle-btn pause-btn" id="pause-toggle">PAUSE</button>
    </div>

    <!-- Satellite Mode Row -->
    <div class="control-row" style="flex-direction: column; align-items: flex-start; gap: 6px; margin-top: 6px;">
      <span class="control-label">Satellite Mode</span>
      <div class="mode-btn-group" id="mode-group">
        <button class="mode-btn active" id="mode-auto">AUTOMATIC</button>
        <button class="mode-btn" id="mode-manual">MANUAL</button>
      </div>
    </div>

    <!-- Manual Mode Add Satellite Section -->
    <div id="manual-satellite-section">
      <div class="panel-subheader">ADD SATELLITE</div>
      <div id="satellite-preview-container" class="preview-box">
        <canvas id="satellite-preview-canvas" width="140" height="90"></canvas>
        <div class="drag-hint">DRAG ME</div>
      </div>
    </div>

    <!-- Live Satellite Status Section -->
    <div id="satellites-status-section">
      <div class="panel-header">SATELLITES</div>
      <div id="satellites-list">
        <!-- Dynamically rendered satellite cards -->
      </div>
    </div>
  </div>

  <div id="canvas-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
