<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyLock 3D Space View</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f1f5f9;
    }

    #webgl-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Loading overlay */
    #loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: #030712;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-Bk6w0Rdj.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">INITIALIZING 3D SPACE ENVIRONMENT...</div>
  </div>

  <div id="webgl-container"></div>

  <script>
    // Safety timeout: if assets haven't loaded after 8s, force-remove the overlay
    setTimeout(function() {
      var ov = document.getElementById('loading-overlay');
      if (ov) { ov.style.opacity = '0'; setTimeout(function() { ov.remove(); }, 400); }
    }, 8000);
  </script>
</body>
</html>
